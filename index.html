<title>BlackLiooonTV</title>
<style>
  :root {
    --bg-yellow: #F5C518;
    --brand-blue: #2E6FF2;
    --tile-bg: #ffffff;
    --tile-shadow: rgba(0, 0, 0, 0.15);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    background-color: var(--bg-yellow);
    font-family: 'Segoe UI', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  h1.name {
    font-size: clamp(2.5rem, 8vw, 5rem);
    color: var(--brand-blue);
    text-align: center;
    margin: 0 0 50px 0;
    font-weight: 800;
    letter-spacing: 1px;
    text-shadow: 2px 2px 0 rgba(255, 255, 255, 0.4);
  }

  .links {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 20px;
    max-width: 800px;
    width: 100%;
  }

  .tile {
    background-color: var(--tile-bg);
    border-radius: 16px;
    padding: 25px 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    color: #222;
    font-weight: 600;
    box-shadow: 0 4px 10px var(--tile-shadow);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .tile:hover {
    transform: translateY(-5px);
    box-shadow: 0 8px 16px var(--tile-shadow);
  }

  .tile svg {
    width: 40px;
    height: 40px;
  }

  .twitch svg { color: #9146FF; }
  .tiktok svg { color: #000000; }
  .instagram svg { color: #E1306C; }
  .youtube svg { color: #FF0000; }
  .discord svg { color: #5865F2; }
</style>
